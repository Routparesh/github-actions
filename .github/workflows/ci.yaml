name: CI

on:
  push:
    branches:
      - ci

jobs:
  Code-Quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest bandit
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Bandit Scan
        run: bandit -r . -ll

  Git-Leaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  SBOM:
    runs-on: ubuntu-latest
    needs: [Code-Quality, Git-Leaks]
    steps:
      - uses: actions/checkout@v4
      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          output-file: sbom.spdx.json
      - uses: anchore/sbom-action/publish-sbom@v0
        with:
          sbom-artifact-match: ".*\\.spdx$"

  Depcheck:
    runs-on: ubuntu-latest
    needs: [Code-Quality, Git-Leaks]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Run Dependency Check
        run: |
          mkdir -p reports
          pip install pip-audit
          pip-audit -f json -o reports/pip-audit-report.json || true
          pip-audit
      - name: Upload Test results
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: ${{ github.workspace }}/reports

  Docker-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Dockerfile exists
        run: test -f Dockerfile
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile

  Tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12, 3.13]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov
      - name: Run tests
        run: |
          pytest --maxfail=1 --disable-warnings -q --cov=. --cov-report=xml
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.python-version }}
          path: coverage.xml

  Docker-Build-Push:
    runs-on: ubuntu-latest
    needs: [Code-Quality, Git-Leaks, SBOM, Depcheck, Docker-lint, Tests]
    outputs:
      image_tag: ${{ steps.vars.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4
      - name: Set image tag
        id: vars
        run: echo "image_tag=${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: |
            routparesh/github-action-tws-app:latest
            routparesh/github-action-tws-app:${{ steps.vars.outputs.image_tag }}

  Trivy-Image-Scan:
    runs-on: ubuntu-latest
    needs: Docker-Build-Push
    steps:
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: routparesh/github-action-tws-app:${{ needs.Docker-Build-Push.outputs.image_tag }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

  Deploy-to-Server:
    runs-on: ubuntu-latest
    needs: Trivy-Image-Scan
    environment: production
    steps:
      - name: Execute remote SSH commands using key
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.PORT }}
          script: |
            docker pull routparesh/github-action-tws-app:${{ needs.Docker-Build-Push.outputs.image_tag }}
            docker rm -f github-action-tws-app || true
            docker run -d --name github-action-tws-app -p 80:80 routparesh/github-action-tws-app:${{ needs.Docker-Build-Push.outputs.image_tag }}
