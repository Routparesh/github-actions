name: CI

on:
  push:
    branches:
      - ci

jobs:
  Code-Quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12, 3.13]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v3
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install flake8 pytest bandit
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Bandit Scan
        run: bandit -r .
  Git-Leaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  Depcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      #   - name: Depcheck
      #     uses: dependency-check/Dependency-Check_Action@main
      #     id: Depcheck
      #     with:
      #       project: 'test'
      #       path: '.'
      #       format: 'HTML'
      #       out: 'reports' # this is the default, no need to specify unless you wish to override it
      #       args: >
      #         --failOnCVSS 7
      #         --enableRetired
      #   - name: Upload Test results
      #     uses: actions/upload-artifact@master
      #     with:
      #       name: Depcheck report
      #       path: ${{github.workspace}}/reports
      - name: Run Dependency Check
        run: |
          pip install pip-audit
          pip-audit
      - name: Upload Test results
        uses: actions/upload-artifact@master
        with:
          name: pip-audit report
          path: ${{github.workspace}}/reports
  Docker-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
  Tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.11, 3.12, 3.13]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # Step 3: Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov

      # Step 4: Run pytest with coverage
      - name: Run tests
        run: |
          pytest --maxfail=1 --disable-warnings -q --cov=. --cov-report=xml

      # Step 5: Upload coverage report as artifact
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
  Docker-Build-Push:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          push: true
          tags: routparesh/github-action-tws-app:latest
  Trivy-Image-Scan:
    runs-on: ubuntu-latest
    needs: Docker-Build-Push
    steps:
      - name: Trivy Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: routparesh/github-action-tws-app:latest
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true
